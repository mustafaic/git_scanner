# Asama 2 iskeleti (+ Asama 1 servisleri). Tam mimari (proxy, egress-proxy,
# backup, webhook-receiver) Asama 3/5'te eklenecek (master_prompt.md 3.4, 7).
# Bilinen, belgelenmis sinirlama: orchestrator burada DOGRUDAN internete
# cikar (egress-proxy henuz yok, bu Asama 3+ kapsami); GitHub App kimligi
# konfigure edilmezse discovery/sync devre disi kalir ve servis sadece
# iskelet/healthcheck modunda calisir.
#
# worker <-> orchestrator ILETISIMI DOSYA TABANLI (paylasilan `staging`
# volume'u uzerinden, master_prompt.md 3.4) -- aralarinda hicbir ag baglantisi
# YOKTUR (worker network_mode:none). `osv_db_cache` ise orchestrator'in
# (ag erisimi olan) indirdigi offline advisory DB'nin worker'a READ-ONLY
# sunuldugu volume'dur (master_prompt.md 5 "Worker izolasyonu").

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scanner_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-scanner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scanner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.orchestrator
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scanner}:${POSTGRES_PASSWORD:-scanner_dev_password}@postgres:5432/${POSTGRES_DB:-scanner}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  # postgres-test / migrate-test: entegrasyon testleri (tests/integration/test_*_postgres.py)
  # ICIN AYRI ve GECICI bir veritabani. Canli `postgres` servisinden kasitli
  # olarak izole: tmpfs veri dizini sayesinde her "docker compose up" ile
  # SIFIRLANIR. Bir test calistirmasinin `DELETE FROM repositories` gibi
  # yikici fixture'lari YANLISLIKLA canli discovery/bulgu verisini silmesin
  # diye eklendi (bkz. 2026-11-08 canli veri kaybi olayi). Entegrasyon
  # testleri `DATABASE_URL`'i BU servise isaret edecek sekilde CALISTIRILMALI,
  # asla varsayilan (canli) DATABASE_URL ile degil.
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scanner_dev_password}
      POSTGRES_DB: scanner_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scanner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  migrate-test:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.orchestrator
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scanner}:${POSTGRES_PASSWORD:-scanner_dev_password}@postgres-test:5432/scanner_test
    depends_on:
      postgres-test:
        condition: service_healthy
    networks: [backend]

  # test-runner: tum pytest calistirmalari BUNUNLA yapilmali (asla `orchestrator`
  # servisiyle, o canli DATABASE_URL'e baglidir). Ornek:
  #   docker compose -f deploy/docker-compose.yml --env-file deploy/.env \
  #     run --rm test-runner pytest tests/ -q
  test-runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.orchestrator
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scanner}:${POSTGRES_PASSWORD:-scanner_dev_password}@postgres-test:5432/scanner_test
      STAGING_DIR: /staging
      DB_CACHE_DIR: /dbs
      GIT_MIRRORS_DIR: /mirrors
      # TestClient/httpx testleri http:// uzerinden calisir -- Secure
      # cookie http.cookiejar tarafindan GERI GONDERILMEZ, bu yuzden test
      # ortaminda kapatilir (bkz. app/main.py, core/config.py).
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - staging-test:/staging
      - git_mirrors_test:/mirrors
    depends_on:
      migrate-test:
        condition: service_completed_successfully
    networks: [backend]

  orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.orchestrator
    environment:
      SERVICE_NAME: orchestrator
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scanner}:${POSTGRES_PASSWORD:-scanner_dev_password}@postgres:5432/${POSTGRES_DB:-scanner}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      DEBOUNCE_WINDOW_SECONDS: ${DEBOUNCE_WINDOW_SECONDS:-20}
      STAGING_DIR: /staging
      DB_CACHE_DIR: /dbs
      GIT_MIRRORS_DIR: /mirrors
      DAILY_JOBS_INTERVAL_HOURS: ${DAILY_JOBS_INTERVAL_HOURS:-24}
      ADVISORY_MAX_AGE_SECONDS: ${ADVISORY_MAX_AGE_SECONDS:-172800}
    volumes:
      - ./secrets:/run/secrets:ro
      - staging:/staging
      - osv_db_cache:/dbs
      - git_mirrors:/mirrors
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    volumes:
      - staging:/staging
      - osv_db_cache:/dbs:ro
      - git_mirrors:/mirrors:ro
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    environment:
      SERVICE_NAME: app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scanner}:${POSTGRES_PASSWORD:-scanner_dev_password}@postgres:5432/${POSTGRES_DB:-scanner}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Varsayilan true (master_prompt.md 5: "Oturum cerezi ... Secure").
      # Yerel docker-compose dev ortami duz HTTP sundugu icin (TLS
      # terminasyonu Asama 5 kapsami) false'a cekilebilir -- bilinen/
      # belgelenmis sinirlama, PROD'DA DAIMA true (TLS'in ardinda) olmali.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  watchdog:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.watchdog
    environment:
      SERVICE_NAME: watchdog
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scanner}:${POSTGRES_PASSWORD:-scanner_dev_password}@postgres:5432/${POSTGRES_DB:-scanner}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      HEARTBEAT_STALE_THRESHOLD_SECONDS: ${HEARTBEAT_STALE_THRESHOLD_SECONDS:-1800}
      WATCHDOG_CHECK_INTERVAL_SECONDS: ${WATCHDOG_CHECK_INTERVAL_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [backend]

volumes:
  postgres_data:
  staging:
  osv_db_cache:
  git_mirrors:
  staging-test:
  git_mirrors_test:

networks:
  backend:
